server {
    listen 80;
    listen [::]:80;
    server_name hirelix.online www.hirelix.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hirelix-acme;
    }

    location / {
        return 301 https://hirelix.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hirelix.online;
    ssl_certificate /etc/letsencrypt/live/hirelix.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirelix.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://hirelix.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hirelix.online;
    ssl_certificate /etc/letsencrypt/live/hirelix.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirelix.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
