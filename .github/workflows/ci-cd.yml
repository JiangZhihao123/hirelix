name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============ CI: 编译与测试 ============
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirelix?sslmode=disable
      BETTER_AUTH_SECRET: ci-better-auth-secret-for-build-only
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      INTERNAL_API_SECRET: ci-internal-api-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: |
          if [ -d tests ] && find tests -name '*.test.ts' -print -quit | grep -q .; then
            npm run test:unit
          else
            echo "No unit tests found; skipping."
          fi

  # ============ CD: 部署到 VPS ============
  deploy-scheduler:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            echo "=== 开始部署调度器 ==="
            cd /opt/hirelix

            # 拉取最新代码
            sudo git fetch origin
            sudo git reset --hard origin/main

            # 安装依赖（如有新增）
            sudo npm ci

            # 重启调度器
            sudo systemctl restart hirelix-scheduler

            # 检查状态
            sleep 3
            sudo systemctl is-active hirelix-scheduler && echo "✅ 调度器运行正常" || echo "❌ 调度器启动失败"

            echo "=== 部署完成 ==="
            echo "当前版本: $(sudo git rev-parse --short HEAD)"
