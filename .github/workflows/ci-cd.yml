name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============ CI: 编译与测试 ============
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  # ============ CD: 部署到 VPS ============
  deploy-scheduler:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '2222' }}
          script: |
            echo "=== 开始部署调度器 ==="
            cd /opt/hirelix

            # 拉取最新代码
            git fetch origin
            git reset --hard origin/main

            # 安装依赖（如有新增）
            npm ci

            # 重启调度器
            systemctl restart hirelix-scheduler

            # 检查状态
            sleep 3
            systemctl is-active hirelix-scheduler && echo "✅ 调度器运行正常" || echo "❌ 调度器启动失败"

            echo "=== 部署完成 ==="
            echo "当前版本: $(git rev-parse --short HEAD)"
