name: Stage verified Linux web release
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: hirelix-web-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify successful build and download exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 41288065744 --repo JiangZhihao123/hirelix --json conclusion --jq .conclusion)" = success
          gh run download 41288065744 --repo JiangZhihao123/hirelix --name hirelix-web-9a80ada9d24e01aee4f94d1feb26845c597f3d12 --dir artifact
          cd artifact && sha256sum -c hirelix-web.tgz.sha256
      - name: Stage using verified OpenSSH host keys
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          hosts="$RUNNER_TEMP/deploy-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$VPS_KEY" > "$key"
          ssh-keyscan -p "$VPS_PORT" -t rsa,ecdsa,ed25519 "$VPS_HOST" > "$hosts" 2>/dev/null
          test -s "$hosts"
          ssh-keygen -lf "$hosts" | awk '{print $2}' | while read -r fp; do
            case "$fp" in
              SHA256:XhJ3JPy4BFsGGj4tywDOI4NI6SdBHLt1s+704e/Iers|SHA256:9hAsS+jskWpnODw/Ko7YJHR7pG7CceICFwqK08OdDPA|SHA256:N4UqTgOE66AHNCpuKocGt7QGRSj+Clmh6+bNQYnvJNw) ;;
              *) echo 'Unrecognized server host key'; exit 1 ;;
            esac
          done
          ssh -i "$key" -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" "$VPS_USER@$VPS_HOST" 'mkdir -p /tmp/hirelix-web-stage-9a80ada9'
          scp -i "$key" -P "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" artifact/hirelix-web.tgz artifact/hirelix-web.tgz.sha256 "$VPS_USER@$VPS_HOST:/tmp/hirelix-web-stage-9a80ada9/"
